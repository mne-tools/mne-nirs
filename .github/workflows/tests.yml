name: 'tests'
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.type }}
  cancel-in-progress: true

jobs:
  # PIP + non-default stim channel + log level info
  job:
    name: '${{ matrix.os }} / ${{ matrix.kind }} / ${{ matrix.mne }}'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mne: stable
            kind: pip
            python: "3.11"  # oldest
          - os: ubuntu-latest
            mne: dev
            kind: pip
            python: "3.14"  # newest
          - os: macos-14
            mne: dev
            kind: conda
            python: "3.13"
          - os: windows-latest
            mne: dev
            kind: conda
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - name: Set test env vars
        run: |
          # On Python >= 3.14 coverage can use sys.monitoring to measure branches, which
          # is much cheaper than the C tracer. Older Pythons fall back to the C tracer
          # (with a CoverageWarning our filters would make an error), so don't ask there.
          case "$PYTHON_VERSION" in
            3.11 | 3.12 | 3.13) ;;
            *) echo "COVERAGE_CORE=sysmon" | tee -a $GITHUB_ENV ;;
          esac
          # Number of pytest-xdist workers: macOS runners have fewer cores and less RAM
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "PYTEST_XDIST_N=2" | tee -a $GITHUB_ENV
          else
            echo "PYTEST_XDIST_N=4" | tee -a $GITHUB_ENV
          fi
        env:
          PYTHON_VERSION: ${{ matrix.python }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
        if: matrix.kind == 'pip'
      - uses: pyvista/setup-headless-display-action@main
        with:
          qt: true
          pyvista: false
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: mne-nirs
          micromamba-version: '2.6.0-0'  # workaround for https://github.com/mamba-org/micromamba-releases/issues/97
          create-args: >-
            python=${{ matrix.python }}
        if: matrix.kind == 'conda'
      - run: pip install -r requirements_testing.txt
      - run: git clone https://github.com/mne-tools/mne-python
      - run: pip install --upgrade --pre -e ./mne-python "git+https://github.com/nilearn/nilearn"
        if: matrix.mne == 'dev'
        name: Install MNE and nilearn dev
      - run: pip install --upgrade --pre cycler "formulaic>=1.1.0" && pip install --upgrade --pre --only-binary=":all:" --extra-index-url "https://pypi.anaconda.org/scientific-python-nightly-wheels/simple" "numpy>=2.5.0.dev0" "scipy>=1.18.0.dev0" h5py "matplotlib>=3.11.0.dev991" "pandas>=3.1.0.dev0" "scikit-learn>=1.9.0.dev0" "statsmodels>=0.14.6" "tables>=3.10.3.dev0"
        if: matrix.mne == 'dev' && startsWith(matrix.os, 'ubuntu')
        name: Install numpy, scipy, nilearn pre
      - run: pip install -ve .
      - run: mne sys_info
      - run: ./tools/get_testing_version.sh
        working-directory: mne-python
      - uses: actions/cache@v6
        with:
          key: ${{ env.TESTING_VERSION }}-1
          path: ~/mne_data
      - run: ./tools/github_actions_download.sh
      - run: pytest -n "$PYTEST_XDIST_N" --dist loadscope --timeout=120 --timeout-method=thread -o faulthandler_timeout=110 --cov=mne_nirs --cov-report=xml -vv -m "not examples" "mne_nirs/"
      - uses: codecov/codecov-action@v7
        if: success()
